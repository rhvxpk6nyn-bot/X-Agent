[project]
name = "x-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "textual>=0.80",
]
[project.scripts]
x-agent = "cli.main:main"
agent = "cli.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "tui*", "web*"]
